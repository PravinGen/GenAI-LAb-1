services:

  mysql:
    image: mysql:8.4
    container_name: library-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: college_library        # ✅ matches your SQL files

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      # ✅ Mount all 5 files — runs alphabetically on first boot
      - ./data/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./data/02_procedures_triggers.sql:/docker-entrypoint-initdb.d/02_procedures_triggers.sql
      - ./data/03_analytics_views.sql:/docker-entrypoint-initdb.d/03_analytics_views.sql
      - ./data/04_seed_data.sql:/docker-entrypoint-initdb.d/04_seed_data.sql
      - ./data/05_indexes_and_queries.sql:/docker-entrypoint-initdb.d/05_indexes_and_queries.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: library-phpmyadmin
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy            # ✅ waits for healthcheck to pass

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "18080:80"

  mcp:
    build: .                                  # ✅ builds from your Dockerfile
    container_name: library-mcp
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy            # ✅ waits for DB before starting

    environment:
      DB_HOST: mysql                          # service name, not localhost
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: college_library

    ports:
      - "19000:19000"

    volumes:
      - .:/app                               # live reload during development

volumes:
  mysql_data: